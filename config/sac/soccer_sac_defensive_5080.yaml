behaviors:
  # Blue Team - Normal Behavior (Optimized for RTX 5080)
  SoccerBlue:
    trainer_type: poca
    
    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      batch_size: 8192        # 4x larger for GPU throughput
      buffer_size: 81920      # 4x larger for better experience diversity
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5            # More epochs for better sample efficiency
    
    network_settings:
      normalize: false
      hidden_units: 512       # 2x larger network for more capacity
      num_layers: 3           # Deeper network
      vis_encode_type: simple
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    keep_checkpoints: 5
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 10000
    checkpoint_interval: 500000
    
  # Purple Team - Defensive Behavior (Optimized for RTX 5080)
  SoccerPurple:
    trainer_type: poca
    
    hyperparameters:
      learning_rate: 3.0e-4
