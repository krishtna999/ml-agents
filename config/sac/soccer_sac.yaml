behaviors:
  SoccerTwos:
    trainer_type: sac
    hyperparameters:
      learning_rate: 3.0e-4
      batch_size: 128
      buffer_size: 500000
      learning_rate_schedule: constant
      tau: 0.005
      steps_per_update: 10.0
      save_replay_buffer: false
      init_entcoef: 0.5
      reward_signal_steps_per_update: 10.0
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 10000