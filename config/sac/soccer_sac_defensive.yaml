behaviors:
  # Blue Team - Normal Behavior
  SoccerBlue:
    trainer_type: sac
    
    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      batch_size: 128
      buffer_size: 500000
      buffer_init_steps: 10000
      tau: 0.005
      steps_per_update: 10.0
      save_replay_buffer: false
      init_entcoef: 1.0
      reward_signal_num_update: 1
    
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 50000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    
    keep_checkpoints: 5
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 10000
    checkpoint_interval: 500000
    threaded: true
    
  # Purple Team - Defensive Behavior ("Best Defense is Good Offense")
  SoccerPurple:
    trainer_type: sac
    
    hyperparameters:
      learning_rate: 3.0e-4
