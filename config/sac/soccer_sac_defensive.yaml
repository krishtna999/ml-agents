behaviors:
  # Blue Team - Normal Behavior
  SoccerBlue:
    trainer_type: poca
    
    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      batch_size: 2048
      buffer_size: 200000  
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    keep_checkpoints: 5
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 10000
    checkpoint_interval: 500000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    threaded: true
    
  # Purple Team - Defensive Behavior ("Best Defense is Good Offense")
  SoccerPurple:
    trainer_type: poca
    
    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      batch_size: 2048
      buffer_size: 200000  
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    keep_checkpoints: 5
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 10000
    checkpoint_interval: 500000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    threaded: true

environment_parameters:
  ball_touch:
    curriculum:
      - name: SmallTouch
        completion_criteria:
          measure: progress
          behavior: SoccerPurple
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.2
        value: 0.5
      - name: MediumTouch
        completion_criteria:
          measure: progress
          behavior: SoccerPurple
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 1.0
      - name: FullTouch
        value: 2.0
